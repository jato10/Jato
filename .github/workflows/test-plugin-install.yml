name: Test Plugin Installation

# Scoped to the vendored addyosmani/agent-skills tree. Upstream runs this on
# every push because the plugin is the whole repository; here it shares a repo
# with unrelated Jato code, so the paths filter keeps it to changes that can
# actually affect the plugin.
on:
  push:
    paths:
      - '.agents/**'
      - '.claude/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.gemini/**'
      - '.opencode/**'
      - 'agents/**'
      - 'commands/**'
      - 'docs/**'
      - 'evals/**'
      - 'hooks/**'
      - 'references/**'
      - 'scripts/**'
      - 'skills/**'
      - 'plugin.json'
      - '.github/workflows/test-plugin-install.yml'
  pull_request:
    paths:
      - '.agents/**'
      - '.claude/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.gemini/**'
      - '.opencode/**'
      - 'agents/**'
      - 'commands/**'
      - 'docs/**'
      - 'evals/**'
      - 'hooks/**'
      - 'references/**'
      - 'scripts/**'
      - 'skills/**'
      - 'plugin.json'
      - '.github/workflows/test-plugin-install.yml'
  workflow_dispatch:

jobs:
  validate-skills:
    name: Validate skill content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate all skills
        run: node scripts/validate-skills.js

      # Upstream's manifest-version checks compare plugin.json against the
      # latest `git describe --tags` release tag. This vendored copy lives in a
      # repository with its own tagging scheme, so those two steps are omitted
      # here (scripts/validate-versions.js is still vendored, unmodified).

      - name: Test skill eval runner
        run: node --test scripts/run-evals-test.js

      - name: Run skill evals (trigger + routing)
        run: node scripts/run-evals.js --min-rank1 80

      - name: Validate references/ links in skills
        run: node scripts/validate-reference-links.js

      - name: Test reference-link validator
        run: node --test scripts/validate-reference-links-test.js

  validate-commands:
    name: Validate command parity and description sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate commands across all tool directories
        run: node scripts/validate-commands.js

      - name: Test command validator
        run: node --test scripts/validate-commands-test.js

      - name: Validate spec/plan/todo artifact paths
        run: node scripts/validate-artifact-paths.js

      - name: Test artifact-path validator
        run: node --test scripts/validate-artifact-paths-test.js

  validate:
    name: Validate plugin structure
    needs: [validate-skills, validate-commands]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin manifests
        run: claude plugin validate .

  test-install:
    name: Test plugin installation
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git to use HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Add marketplace
        run: claude plugin marketplace add ./

      - name: List marketplaces
        run: claude plugin marketplace list

      - name: Install plugin
        run: claude plugin install agent-skills@addy-agent-skills --scope user
